  <header class="site-header" id="top">
    <div class="container header-inner">
      <a class="brand" href="/" aria-label="You-nique by Lis — home">
        <svg class="brand-crown" aria-hidden="true"><use href="#crown" /></svg>
        <span class="brand-script">You-nique</span>
        <span class="brand-by">by Lis</span>
      </a>
      <nav class="manage-nav" aria-label="Main">
        <a class="manage-home" href="/" data-i18n="manage.back">Back to the website</a>
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" data-lang="en" aria-pressed="true">EN</button>
          <button type="button" data-lang="nl" aria-pressed="false">NL</button>
        </div>
        <a class="btn btn-gold btn-sm manage-book" href="/#book" data-i18n="nav.book">Book now</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="manage-hero">
      <div class="hero-pattern" aria-hidden="true"></div>
      <svg class="manage-hero-art" viewBox="0 0 1200 360" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <g fill="url(#g-gold)">
          <use href="#sparkle" x="176" y="96" width="30" height="30" />
          <use class="d2" href="#sparkle" x="252" y="214" width="14" height="14" />
          <use class="d3" href="#sparkle" x="964" y="82" width="20" height="20" />
          <use href="#sparkle" x="1010" y="236" width="34" height="34" />
          <use class="d2" href="#sparkle" x="890" y="300" width="12" height="12" />
        </g>
      </svg>
      <div class="container manage-hero-inner">
        <p class="kicker script" data-i18n="manage.kicker">Your appointment</p>
        <h1 data-i18n="manage.heading">Manage my booking</h1>
        <div class="ornament" aria-hidden="true"><span></span><svg><use href="#crown" /></svg><span></span></div>
        <p class="manage-lead" data-i18n="manage.lead">Look up your appointment, save it to your calendar, or cancel it if your plans change.</p>
      </div>
    </section>

    <section class="manage-body">
      <div class="container">
        <div class="manage-stack" id="manage" aria-live="polite">
          <noscript><p class="card manage-card">Please enable JavaScript to manage your booking, or message us on WhatsApp.</p></noscript>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <a class="brand brand-lg" href="/">
        <svg class="brand-crown" aria-hidden="true"><use href="#crown" /></svg>
        <span class="brand-script">You-nique</span>
        <span class="brand-by">by Lis</span>
      </a>
      <p class="footer-tag" data-i18n="footer.tag">Nails as unique as you.</p>
      <div class="socials">
        <a id="fb-footer" href="#" target="_blank" rel="noopener" aria-label="Facebook"><svg><use href="#i-facebook" /></svg></a>
        <a data-wa href="#" target="_blank" rel="noopener" aria-label="WhatsApp"><svg><use href="#i-whatsapp" /></svg></a>
      </div>
      <p class="fine">© <span id="year">2026</span> You-nique by Lis · Lelydorp, Suriname · <a href="/admin" data-i18n="footer.staff">Salon login</a></p>
    </div>
  </footer>

  <a class="wa-float" data-wa href="#" target="_blank" rel="noopener" aria-label="Chat on WhatsApp">
    <svg aria-hidden="true"><use href="#i-whatsapp" /></svg>
  </a>

  <script type="module" src="/js/manage.js"></script>
</body>
</html>
